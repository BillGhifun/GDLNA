<script>
function getQueryParam(key) {
     var query = location.search.substring(1);
     var arr = query.split('&');
     for (var i = 0; i < arr.length; i++) {
         var pair = arr[i].split('=')
         if (pair[0] == key) {
             return pair[1]
	//alert(pair[1]);
         }
     }
return ""
}
</script>

<script>
function dlna_media_set(k)
{
	var r = confirm("是否播放?");
	if (r)
	{
		document.getElementById("EventBak").value="";
		var xhr = new XMLHttpRequest();
		//alert(encodeURI(k));
		xhr.open('GET', '/dlna_media_set?media=' + encodeURI(k), true);
		xhr.responseType = 'text';
		xhr.onload = function () {
    		if (xhr.readyState === xhr.DONE) {
        		if (xhr.status === 200) {
				//alert(xhr.responseText);
				document.getElementById("EventBak").value=xhr.responseText;
				//alert(xhr.responseText);
        		}
    		}
		};
		xhr.send();
	}
}
</script>

<script>
function select_dlna_device(t) {
	const xhb = new XMLHttpRequest();
	xhb.open("GET", "/select_dlna_device?id=" + t,true);
	xhb.getResponseHeader("Content-type", "application/json");
	xhb.onload = function() {
	if (xhb.readyState === xhb.DONE) {
		if (xhb.status === 200) {
			var jsona =JSON.parse(xhb.responseText);
			//var sa=xhb.responseText;
			//var tmp = document.createElement('div');
			//var SignFrame=tmp.innerHTML+=sa;
			//document.getElementById("get_applyipwhite").appendChild(tmp);//添加到你指的的id的地方
			//document.getElementById("get_applyipwhite").innerHTML=xhb.responseText;
			document.getElementById("web_dlna_device_name").getElementsByTagName('h4')[0].innerHTML = jsona[0].value
			document.getElementById("web_dlna_device_name").getElementsByTagName('p')[0].innerHTML = jsona[1].value
		}
	}
	}
xhb.send();
}
</script>

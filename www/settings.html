<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhifunDLNA - 设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #60a5fa 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            text-align: center;
        }

        .hint {
            margin-top: 30px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hint h2 {
            font-size: 1.5rem;
            color: #60a5fa;
            margin-bottom: 15px;
            text-align: center;
        }

        .hint p {
            font-size: 1rem;
            line-height: 1.8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>系统设置</h1>
        <p>设置页面正在开发中...</p>
        
        <div class="hint">
            <h2>提示</h2>
            <p>
                您可以在 Config.ini 文件中配置服务器地址等参数。<br>
                修改配置文件后需要重启服务才能生效。
            </p>
        </div>
    </div>
</body>
</html>
